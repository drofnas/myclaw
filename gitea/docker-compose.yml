services:
  gitea:
    image: gitea/gitea:1.21
    container_name: gitea
    restart: always
    environment:
      - GITEA__database__DB_TYPE=sqlite3 # No extra DB container needed
      - GITEA__server__DOMAIN=myclaw-gitea
      - GITEA__server__SSH_PORT=2222
      - GITEA__server__HTTP_PORT=3000
      # Served via Tailscale Serve (HTTPS) by a sidecar.
      - GITEA__server__ROOT_URL=https://myclaw-gitea/
    volumes:
      - ./gitea_data:/data