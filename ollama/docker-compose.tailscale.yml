services:
  tailscale-ollama:
    image: tailscale/tailscale:stable
    container_name: myclaw-ollama-tailscale
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${MYCLAW_TS_AUTHKEY:-}
      - TS_AUTH_ONCE=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_HOSTNAME=${MYCLAW_OLLAMA_TS_HOSTNAME:-myclaw-ollama}
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - myclaw-ollama-ts-state:/var/lib/tailscale
      - ./config/tailscale-ollama-serve.json:/config/serve.json:ro

  ollama:
    depends_on:
      - tailscale-ollama
    network_mode: service:tailscale-ollama
    ports: []

volumes:
  myclaw-ollama-ts-state:
